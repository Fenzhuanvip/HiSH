name: Build HAP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: checkout

      - name: Setup Node.js
        uses: setup-node
        with:
          node-version: 22

      # ===== 直接调用华为开发者 API 获取 CLT 下载链接 =====
      - name: Get CLT download URL via API
        run: |
          set -x
          # 尝试多种 API URL 和方式
          BASE="https://svc-drcn.developer.huawei.com/codeserver"
          API="PartnerCommunityService/v1/developer/downloadCenter"
          
          for path in "getLatestToolVersion" "getToolList"; do
            for method in POST GET; do
              echo "=== 尝试 $method $BASE/$API/$path ==="
              curl -s --max-time 15 -X $method "$BASE/$API/$path" \
                -H "Content-Type: application/json" \
                -H "User-Agent: Mozilla/5.0" \
                -H "Referer: https://developer.huawei.com/consumer/cn/download/" \
                -H "Origin: https://developer.huawei.com" \
                -d '{"toolType":"commandLineTools","osType":"linux"}' \
                -w "\nHTTP %{http_code}\n" 2>/dev/null | head -c 2000
              echo ""
            done
          done
          
          # 也尝试不加 /codeserver
          BASE2="https://svc-drcn.developer.huawei.com"
          for path in "getLatestToolVersion" "getToolList"; do
            echo "=== 尝试 POST $BASE2/$API/$path ==="
            curl -s --max-time 15 -X POST "$BASE2/$API/$path" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Referer: https://developer.huawei.com/consumer/cn/download/" \
              -d '{}' \
              -w "\nHTTP %{http_code}\n" 2>/dev/null | head -c 2000
            echo ""
          done
          
          # 尝试 codeserversvc
          BASE3="https://svc-drcn.developer.huawei.com/codeserversvc"
          for path in "getLatestToolVersion" "getToolList"; do
            echo "=== 尝试 POST $BASE3/$API/$path ==="
            curl -s --max-time 15 -X POST "$BASE3/$API/$path" \
              -H "Content-Type: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -d '{}' \
              -w "\nHTTP %{http_code}\n" 2>/dev/null | head -c 2000
            echo ""
          done

      - name: Install DevEco CLI
        run: npm install -g @deveco/deveco-cli@latest

      - name: Fetch build resources
        run: |
          git clone --branch resources --depth 1 --single-branch https://atomgit.com/ff-518/HiSH.git /tmp/resources-repo || \
          git clone --branch resources --depth 1 --single-branch "https://x-access-token:${GITHUB_TOKEN}@atomgit.com/ff-518/HiSH.git" /tmp/resources-repo
          ls -lh /tmp/resources-repo/resources/
          tar xzf /tmp/resources-repo/resources/libvncserver.tar.gz -C feature/hish_main/src/main/cpp/
          mkdir -p feature/hish_main/libs/
          unzip -q /tmp/resources-repo/resources/libs.zip -d feature/hish_main/libs/
          mkdir -p feature/hish_main/src/main/resources/rawfile/vm/
          cp /tmp/resources-repo/resources/kernel_aarch64 feature/hish_main/src/main/resources/rawfile/vm/
          cp /tmp/resources-repo/resources/rootfs_aarch64.qcow2 feature/hish_main/src/main/resources/rawfile/vm/

      - name: Configure build profile
        run: cp build-profile.template.json5 build-profile.json5

      - name: Build HAP
        run: |
          export DEVECO_CLI_CLT_PATH=/opt/clt
          devecocli build --build-mode release

      - name: Collect HAP
        run: |
          mkdir -p artifacts
          find . -name "*.hap" -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload HAP
        uses: upload-artifact
        with:
          name: hish-hap
          path: artifacts/*.hap
          retention-days: 30
