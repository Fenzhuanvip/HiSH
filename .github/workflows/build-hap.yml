name: Build HAP

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build HAP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLT_URL: https://mirrors.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
      TOOL_HOME: /opt/command-line-tools

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch binary resources
        run: |
          set -e
          VM_DIR="feature/hish_main/src/main/resources/rawfile/vm"
          LIBS_DIR="feature/hish_main/libs"
          mkdir -p "$VM_DIR" "$LIBS_DIR"

          # 从 atomgit resources 分支拉取构建资源
          if git clone --branch resources --depth 1 --single-branch \
            "https://ff-518:fNCrAW6XzAx_P-19_RymJr7t@atomgit.com/ff-518/HiSH.git" /tmp/resources-repo; then
            if [ -f /tmp/resources-repo/resources/libvncserver.tar.gz ]; then
              tar xzf /tmp/resources-repo/resources/libvncserver.tar.gz \
                -C feature/hish_main/src/main/cpp/
            fi
            if [ -f /tmp/resources-repo/resources/libs.zip ]; then
              unzip -qo /tmp/resources-repo/resources/libs.zip -d "$LIBS_DIR/"
            fi
            cp -f /tmp/resources-repo/resources/kernel_aarch64 "$VM_DIR/" 2>/dev/null || true
            cp -f /tmp/resources-repo/resources/rootfs_aarch64.qcow2 "$VM_DIR/" 2>/dev/null || true
          fi

          # 备用下载源
          if [ ! -f "$VM_DIR/kernel_aarch64" ]; then
            wget -q --show-progress \
              https://github.com/harmoninux/linux-config/releases/download/kernel-20260228/kernel_aarch64 \
              -O "$VM_DIR/kernel_aarch64"
          fi
          if [ ! -f "$VM_DIR/rootfs_aarch64.qcow2" ]; then
            wget -q --show-progress \
              https://github.com/harmoninux/linux-config/releases/download/rootfs-20260117/rootfs_aarch64.qcow2 \
              -O "$VM_DIR/rootfs_aarch64.qcow2"
          fi
          ls -lh "$VM_DIR"

      - name: Prepare QEMU libs
        run: |
          set -e
          if [ ! -d feature/hish_main/libs/arm64-v8a ] || [ -z "$(ls -A feature/hish_main/libs/arm64-v8a 2>/dev/null)" ]; then
            wget -q --show-progress \
              https://github.com/harmoninux/qemu/releases/download/hish-20260110/libs.zip \
              -O /tmp/libs.zip
            unzip -qo /tmp/libs.zip -d feature/hish_main/libs/
          fi
          ls -lh feature/hish_main/libs/arm64-v8a/ | head

      - name: Download HarmonyOS Command Line Tools (Huawei Cloud mirror)
        run: |
          set -e
          df -h /tmp /opt
          for i in 1 2 3 4 5; do
            if wget -c -q --tries=2 --timeout=60 "$CLT_URL" -O /tmp/clt.zip; then
              echo "download attempt $i ok"
              break
            fi
            echo "download attempt $i failed, retrying..."
            sleep 5
          done
          ls -lh /tmp/clt.zip
          test $(stat -c%s /tmp/clt.zip) -gt 1000000000 || { echo "CLT zip too small, download incomplete"; exit 1; }
          df -h /tmp /opt
          sudo mkdir -p "$TOOL_HOME"
          sudo unzip -q /tmp/clt.zip -d /opt/
          # 修复权限：sudo 解压后目录归 root，runner 用户无法访问
          sudo chown -R "$(id -u):$(id -g)" /opt/command-line-tools
          sudo chmod -R a+rX /opt/command-line-tools
          # zip 内部是 command-line-tools/ 目录，解压到 /opt/ 后即 /opt/command-line-tools
          echo "=== CLT 顶层结构 ==="
          ls -la "$TOOL_HOME"
          HVIGORW=$(find "$TOOL_HOME" -name hvigorw -type f | head -1)
          if [ -z "$HVIGORW" ]; then
            echo "未找到 hvigorw:"
            find "$TOOL_HOME" -maxdepth 2 -type d
            exit 1
          fi
          echo "TOOL_HOME=$TOOL_HOME" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$TOOL_HOME/sdk" >> "$GITHUB_ENV"
          echo "$TOOL_HOME/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$HVIGORW")" >> "$GITHUB_PATH"
          echo "TOOL_HOME=$TOOL_HOME, hvigorw=$HVIGORW"

      - name: Verify toolchain
        run: |
          which ohpm || ls "$TOOL_HOME/bin/"
          ohpm -v || true
          node "$TOOL_HOME/hvigor/bin/hvigorw.js" --version 2>/dev/null || \
            hvigorw --version 2>/dev/null || echo "hvigor version check skipped"
          echo "=== SDK 目录结构 ==="
          ls -la "$TOOL_HOME/sdk/" 2>/dev/null || true
          ls -la "$TOOL_HOME/sdk/default/" 2>/dev/null || true
          ls -la "$TOOL_HOME/sdk/default/openharmony/" 2>/dev/null || true
          echo "=== SDK 版本信息 ==="
          find "$TOOL_HOME/sdk" -name "oh-uni-package.json" -exec cat {} \; 2>/dev/null || true
          find "$TOOL_HOME/sdk" -name "api-version" -exec sh -c 'echo "$1:"; cat "$1"' _ {} \; 2>/dev/null || true
          find "$TOOL_HOME/sdk" -name "version" -exec sh -c 'echo "$1:"; cat "$1"' _ {} \; 2>/dev/null || true

      - name: Install ohpm deps
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          for i in 1 2 3 4 5 6; do
            if ohpm install; then
              echo "ohpm install attempt $i ok"
              exit 0
            fi
            echo "ohpm install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "ohpm install failed after 6 attempts"
          exit 1

      - name: Configure build profile
        run: cp -f build-profile.template.json5 build-profile.json5

      - name: Build HAP
        run: |
          set -eo pipefail
          chmod +x "$TOOL_HOME/hvigor/bin/hvigorw" 2>/dev/null || true
          node "$TOOL_HOME/hvigor/bin/hvigorw.js" assembleHap \
            --mode module -p product=default -p debuggable=false --no-daemon \
            2>&1 | tee build-output.txt

      - name: Collect HAP
        if: success() || failure()
        run: |
          mkdir -p artifacts
          find . -name "*.hap" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts/ || true
          # 收集 hvigor 构建日志
          find . -path "*/.hvigor/outputs/build-logs/*.log" -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload HAP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hish-hap
          path: artifacts/*.hap
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.txt
            artifacts/*.log
            hvigor/hvigor-config.json5
            oh-package.json5
            build-profile.json5
          retention-days: 7
          if-no-files-found: ignore
